# dsh-auto-retry bundle patch —— 只插入插件自己这一行。
# 面板可写字段由 lib/index.js 导出的 Config（.volatile()）声明，
# 客户端面板在 settings.section 上注册 id `auto-retry` 的导航。
- insert:
    - id: auto-retry
      name: 'dsh-auto-retry'
      # DSH STORE 权限声明：浏览器只请求同源 /api/auto-retry/*。
      # 不读写文件、不持久化、不使用凭据。
      permissions:
        network: true
        storage: false
